name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      # On a tag push, actions/checkout is already at the tagged commit.
      # Manual backfill runs on the default branch and must switch to the
      # requested tag before packing.
      - name: Check out the tagged commit (manual backfill only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth=1 origin "refs/tags/${{ steps.tag.outputs.tag }}:refs/tags/${{ steps.tag.outputs.tag }}"
          git checkout "${{ steps.tag.outputs.tag }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install and pack
        run: |
          pnpm install --frozen-lockfile
          pnpm pack

      - name: Extract changelog notes
        run: bash .github/scripts/extract-changelog.sh "${{ steps.tag.outputs.tag }}" release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release for ${TAG} already exists; skipping"
            exit 0
          fi
          gh release create "${TAG}" dsh-asc-*.tgz \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file release-notes.md
