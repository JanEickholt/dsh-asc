name: backfill-releases

on:
  push:
    branches:
      - 'backfill-releases'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install once
        run: pnpm install --frozen-lockfile

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Publish or refresh release notes for every v* tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in $(git tag -l 'v*' | sort -V); do
            bash .github/scripts/extract-changelog.sh "${tag}" release-notes.md
            echo "notes for ${tag}:"
            head -n 3 release-notes.md
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '{id: .id}' 2>/dev/null || true)"
            if [ -n "${release_json}" ]; then
              release_id="$(echo "${release_json}" | jq -r '.id')"
              echo "refreshing notes for ${tag} (release ${release_id})"
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                -F body=@"release-notes.md" >/dev/null
              continue
            fi
            echo "publishing release for ${tag}"
            git checkout "${tag}"
            rm -f dsh-asc-*.tgz
            pnpm install --frozen-lockfile
            pnpm pack
            gh release create "${tag}" dsh-asc-*.tgz \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${tag}" \
              --notes-file release-notes.md
            rm -f dsh-asc-*.tgz
            git checkout main
          done
