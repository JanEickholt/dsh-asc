name: npm-publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Detect classic token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "present=1" >> "${GITHUB_OUTPUT}"
          else
            echo "using npm trusted publishing (OIDC)"
          fi

      - name: Install and build
        run: pnpm install --frozen-lockfile

      - name: Publish with npm trusted publishing (OIDC)
        if: steps.token.outputs.present != '1'
        # Until the package's Trusted Publisher is configured on npm this
        # step reports the configuration gap without failing the release.
        continue-on-error: true
        run: npm publish --provenance --access public

      - name: Publish with classic npm token
        if: steps.token.outputs.present == '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
